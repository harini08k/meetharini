# New YouTube videos show up in the scrapbook by themselves: this pings the host to rebuild once a day.
name: Daily rebuild
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a new deploy
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "No DEPLOY_HOOK_URL secret yet, skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
